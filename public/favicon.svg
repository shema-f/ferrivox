<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#111c30" />
      <stop offset="60%" stop-color="#070c17" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <!-- Metallic Titanium Gradient -->
    <linearGradient id="metalChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#f1f5f9" />
      <stop offset="45%" stop-color="#cbd5e1" />
      <stop offset="55%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Electric Accent Gradient -->
    <linearGradient id="electricGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Metallic Rim Border -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="40%" stop-color="rgba(148, 163, 184, 0.15)" />
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.3)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="fxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge / Squircle with metallic rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGlow)" stroke="url(#rimGrad)" stroke-width="1.5" />

  <!-- Subtle grid accent line -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" />

  <!-- Monogram Group -->
  <g id="fx-monogram">
    <!-- Styled "F" with sharp industrial cuts & lightning notch -->
    <path
      d="M 13 16
         L 32 16
         L 32 23
         L 21.5 23
         L 21.5 28.5
         L 29.5 28.5
         L 30.5 34.5
         L 21.5 34.5
         L 21.5 48
         L 13 48
         Z"
      fill="url(#metalChrome)"
    />

    <!-- Lightning cut accent on F's stem -->
    <path
      d="M 19 23 L 23 23 L 18 31 L 22 31 L 16 41 L 18.5 33 L 16 33 Z"
      fill="url(#electricGrad)"
      filter="url(#fxGlow)"
      opacity="0.9"
    />

    <!-- Styled "X" with dynamic angles and pulse gap -->
    <path
      d="M 33 16
         L 40 16
         L 46.5 26.5
         L 53 16
         L 60 16
         L 50.5 31
         L 60.5 48
         L 53.5 48
         L 46.5 36
         L 39.5 48
         L 32.5 48
         L 42.8 31.5
         Z"
      fill="url(#metalChrome)"
    />

    <!-- Ferrivox Kinetic Pulse / Wave passing across X -->
    <path
      d="M 28 32
         Q 35 32 39 32
         Q 42 32 44.5 24
         L 47.5 40
         L 50 28
         Q 52.5 32 55.5 32
         Q 59 32 63 32"
      fill="none"
      stroke="url(#electricGrad)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#fxGlow)"
    />
  </g>
</svg>
